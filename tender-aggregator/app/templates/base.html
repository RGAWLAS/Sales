<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Tender Aggregator{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
  <nav class="bg-white border-b border-slate-200 sticky top-0 z-10">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="/" class="flex items-center gap-2 text-slate-900">
        <span class="inline-block w-2 h-2 rounded-full bg-emerald-500"></span>
        <span class="font-semibold">Tender Aggregator</span>
      </a>
      <div class="flex items-center gap-4 text-sm">
        <a href="/" class="text-slate-700 hover:text-blue-700">Przetargi</a>
        <a href="/signals" class="text-slate-700 hover:text-blue-700">Sygnały rynkowe</a>
        <a href="/sources" class="text-slate-700 hover:text-blue-700">Źródła</a>
      </div>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto px-4 py-6">
    {% block content %}{% endblock %}
  </main>

  <footer class="max-w-7xl mx-auto px-4 py-6 text-xs text-slate-400">
    Tender Aggregator &middot; generated {{ (request and request.scope) and "" }}
  </footer>
</body>
</html>
